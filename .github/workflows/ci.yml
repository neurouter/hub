name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 26 is the runtime (Active LTS); CI also runs on 24 (backend plan addendum, C1)
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # peer/version problems (e.g. a hoisted ajv@6 satisfying an ajv ^8 peer) fail the build
      - run: npm ls --all > /dev/null
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          EMBEDDINGS_ENABLED: 'false'
      - run: npm run build
