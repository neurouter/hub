name: Helm chart

# Publishes the chart to oci://ghcr.io/neurouter/charts when Chart.yaml carries a version that
# isn't published yet (chart-only fixes between app releases). Tagged releases also push it.
on:
  push:
    branches: [master]
    paths: ['deploy/helm/neurouter/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint, and push when the version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm lint deploy/helm/neurouter
          version="$(helm show chart deploy/helm/neurouter | awk '/^version:/ {print $2}')"
          if helm show chart oci://ghcr.io/neurouter/charts/neurouter --version "$version" >/dev/null 2>&1; then
            echo "Chart $version is already published; nothing to do."
            exit 0
          fi
          helm package deploy/helm/neurouter --destination dist-chart
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist-chart/*.tgz oci://ghcr.io/neurouter/charts
