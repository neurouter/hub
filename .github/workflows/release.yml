name: Release

# Push a tag like v0.1.0 to publish:
# - multi-arch image to ghcr.io/neurouter/neurouter (and Docker Hub when DOCKERHUB_* secrets exist)
# - keyless cosign signature, SPDX SBOM and build provenance
# - Helm chart to oci://ghcr.io/neurouter/charts
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/neurouter/neurouter

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing + provenance
      attestations: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_USERNAME != '' && 'docker.io/neurouter/neurouter' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package and push chart
        run: |
          helm lint deploy/helm/neurouter
          helm package deploy/helm/neurouter --destination dist-chart
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist-chart/*.tgz oci://ghcr.io/neurouter/charts

  mcp-registry:
    # Publishes server.json as com.neurouter/gateway (DNS auth on neurouter.com).
    # Skipped until the MCP_REGISTRY_PRIVATE_KEY secret (hex Ed25519 seed) exists.
    runs-on: ubuntu-latest
    needs: image
    if: github.ref_type == 'tag'
    permissions:
      contents: read
    env:
      MCP_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
      PUBLISHER_VERSION: v1.8.16
    steps:
      - uses: actions/checkout@v7
      - name: Publish to the MCP Registry
        if: env.MCP_PRIVATE_KEY != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[0].identifier = "ghcr.io/neurouter/neurouter:\($v)"' server.json > server.json.tmp
          mv server.json.tmp server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain neurouter.com
          ./mcp-publisher publish
