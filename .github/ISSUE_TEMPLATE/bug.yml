name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Don't file it here: see SECURITY.md."
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include what you expected instead. }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
    validations: { required: true }
  - type: dropdown
    id: deploy
    attributes:
      label: Deployment
      options: [Docker Compose, Helm / Kubernetes, Local dev (npm), Other]
    validations: { required: true }
  - type: dropdown
    id: db
    attributes: { label: Database, options: [SQLite, Postgres] }
  - type: input
    id: client
    attributes: { label: MCP client, description: "e.g. Claude Code, Cursor, VS Code" }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: Redact secrets., render: text }
