# Local Dex for `docker compose --profile oidc up` (development only).
issuer: http://localhost:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
enablePasswordDB: true
staticPasswords:
  - email: admin@example.com
    # bcrypt of "password"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
staticClients:
  - id: neurouter
    name: Neurouter Hub
    secret: neurouter-dev-secret
    redirectURIs:
      - http://localhost:3000/api/auth/callback
