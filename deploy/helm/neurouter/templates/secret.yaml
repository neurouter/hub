{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neurouter.dbSecret" . }}
  labels: {{- include "neurouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url (or database.existingSecret) is required" .Values.database.url | quote }}
  {{- with .Values.database.auditUrl }}
  AUDIT_DATABASE_URL: {{ . | quote }}
  {{- end }}
---
{{- end }}
{{- if not .Values.crypto.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neurouter.cryptoSecret" . }}
  labels: {{- include "neurouter.labels" . | nindent 4 }}
  annotations:
    # never regenerate keys on upgrade: losing them makes stored secrets unreadable
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  NEUROUTER_MASTER_KEYS: {{ required "crypto.masterKeys (or crypto.existingSecret) is required" .Values.crypto.masterKeys | quote }}
  NEUROUTER_ACTIVE_KEY_ID: {{ required "crypto.activeKeyId is required" .Values.crypto.activeKeyId | quote }}
  HASH_PEPPER: {{ required "crypto.hashPepper is required" .Values.crypto.hashPepper | quote }}
---
{{- end }}
{{- if and .Values.oidc.issuer (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neurouter.oidcSecret" . }}
  labels: {{- include "neurouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: {{ required "oidc.clientSecret (or oidc.existingSecret) is required" .Values.oidc.clientSecret | quote }}
{{- end }}
