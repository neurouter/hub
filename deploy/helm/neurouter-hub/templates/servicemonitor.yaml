{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "neurouter.fullname" . }}
  labels: {{- include "neurouter.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "neurouter.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.metrics.token }}
      bearerTokenSecret: { name: {{ include "neurouter.fullname" . }}-metrics, key: token }
      {{- end }}
---
{{- if .Values.metrics.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neurouter.fullname" . }}-metrics
  labels: {{- include "neurouter.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.metrics.token | quote }}
{{- end }}
{{- end }}
